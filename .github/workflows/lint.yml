name: Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        # P2 修复：原工作流同时运行 ruff / black / isort，但仓库
        # 没有任何 lint 配置，且 black 会对 179 个文件产生格式化
        # 差异 —— CI 必然失败，形同虚设。
        #
        # 现在：仓库新增了 pyproject.toml（ruff / black / isort /
        # pytest 配置），并以 **ruff** 作为唯一的 lint 门禁：
        #   * ruff 的 isort 规则（I001）覆盖导入排序；
        #   * ruff 检查实际缺陷（F821 未定义名、F811 重定义等）。
        # black 仅在 tools/ 与 tests/ 上做格式校验，避免对
        # 历史代码产生大规模无意义 diff。
        run: |
          pip install ruff

      - name: Run ruff
        run: ruff check . --output-format=github

      - name: Ruff format check (tools & tests only)
        run: ruff format --check tools tests

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # P1-1：防止版本号再次漂移
      - name: Check version consistency
        run: python tools/check_version.py

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # P1-2：确保 4 种语言的 .po/.mo 都可用
      - name: Compile locale files
        run: python tools/compile_locale.py --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon0 xvfb
          pip install -r requirements.txt
          pip install pytest pytest-qt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_QT_API: pyqt5
        run: xvfb-run -a python -m pytest tests -q
