name: Test Fallback (hosted)

# self-hosted runner 长时间排队/卡死时的兜底测试（GitHub 托管 Windows）
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-fallback-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      QT_QPA_PLATFORM: 'offscreen'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests (sharded)
        run: python tools/run_tests_sharded.py --shards 2 --retries 1 --parallel
