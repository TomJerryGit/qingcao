name: Publish Plugin Registry

on:
  workflow_dispatch:
  # 仅当本工作流文件本身变更时自触发（用于无本地 Token 场景重发注册表）
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish_registry.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cryptography
      - name: Build registry
        env:
          QINGCAO_PLUGIN_SIGN_KEY: ${{ secrets.QINGCAO_PLUGIN_SIGN_KEY }}
        run: python tools/publish_registry_release.py --dry-run --out data/registry_github
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QINGCAO_PLUGIN_SIGN_KEY: ${{ secrets.QINGCAO_PLUGIN_SIGN_KEY }}
        run: |
          if [ -z "$QINGCAO_PLUGIN_SIGN_KEY" ]; then
            echo "缺少 secret QINGCAO_PLUGIN_SIGN_KEY"; exit 1
          fi
          python tools/publish_registry_release.py --out data/registry_github
