name: Publish Plugin Registry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cryptography
      - name: Build registry
        env:
          QINGCAO_PLUGIN_SIGN_KEY: ${{ secrets.QINGCAO_PLUGIN_SIGN_KEY }}
        run: python tools/publish_registry_release.py --dry-run --out data/registry_github
      - name: Publish
        if: ${{ secrets.QINGCAO_PLUGIN_SIGN_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QINGCAO_PLUGIN_SIGN_KEY: ${{ secrets.QINGCAO_PLUGIN_SIGN_KEY }}
        run: python tools/publish_registry_release.py --out data/registry_github
