name: Ratings Ingest

on:
  schedule:
    - cron: "0 4 * * *"   # 每日 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  actions: write

concurrency:
  group: ratings-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ingest issue ratings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/collect_issue_ratings.py --apply
      - name: Commit & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "qingcao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add community_ratings.json 2>/dev/null || true
          git add -f data/ratings_ingested.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无新评分，跳过发布"
            exit 0
          fi
          git commit -m "chore(ratings): ingest issue ratings"
          git push
          gh workflow run publish_registry.yml --repo "$GITHUB_REPOSITORY"
