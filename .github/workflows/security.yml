name: Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-linux-ci.txt"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit source requirements
        continue-on-error: true
        run: |
          python -m pip_audit -r requirements.txt             --format markdown --output pip-audit-source.md || true
          cat pip-audit-source.md 2>/dev/null || true
      - name: Audit Linux CI requirements
        continue-on-error: true
        run: |
          python -m pip_audit -r requirements-linux-ci.txt             --format markdown --output pip-audit-linux.md || true
          cat pip-audit-linux.md 2>/dev/null || true
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-reports
          path: pip-audit-*.md
