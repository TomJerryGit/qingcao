name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
jobs:
  build-release:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout (SSH)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $log = "D:\actions-runner\release.log"
          "CHECKOUT_START" | Out-File $log -Encoding utf8
          $env:HOME = "C:\Users\Administrator"
          $env:USERPROFILE = "C:\Users\Administrator"
          $env:GIT_TERMINAL_PROMPT = "0"
          $git = "d:\Program Files\Git\cmd\git.exe"
          $dir = $env:GITHUB_WORKSPACE
          $url = "git@github.com:$env:GITHUB_REPOSITORY.git"
          if (-not (Test-Path "$dir\.git")) { & $git clone $url $dir }
          & $git -C $dir remote set-url origin $url
          $out = & $git -C $dir fetch --tags --force origin 2>&1
          "fetch_rc=$LASTEXITCODE" | Out-File $log -Append -Encoding utf8
          $out | Select-Object -Last 5 | Out-File $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          $out = & $git -C $dir reset --hard $env:GITHUB_SHA 2>&1
          "reset_rc=$LASTEXITCODE" | Out-File $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }
          "CHECKOUT_OK" | Out-File $log -Append -Encoding utf8

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $log = "D:\actions-runner\release.log"
          python --version 2>&1 | Out-File $log -Append -Encoding utf8
          python -m pip install --upgrade pip 2>&1 | Select-Object -Last 3 | Out-File $log -Append -Encoding utf8
          & python -m pip install -r requirements.txt pyinstaller 2>&1 | Select-Object -Last 6 | Out-File $log -Append -Encoding utf8
          "pip_rc=$LASTEXITCODE" | Out-File $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          "DEPS_OK" | Out-File $log -Append -Encoding utf8

      - name: Build
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $log = "D:\actions-runner\release.log"
          "BUILD_START" | Out-File $log -Append -Encoding utf8
          & python build.py 2>&1 | Select-Object -Last 12 | Out-File $log -Append -Encoding utf8
          "build_rc=$LASTEXITCODE" | Out-File $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $ver = (Get-Content VERSION -Encoding UTF8).Trim()
          $exe = "dist\QingCaoEditor\QingCaoEditor.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          $fv = (Get-Item $exe).VersionInfo.FileVersion
          "BUILD_OK ver=$ver fv=$fv" | Out-File $log -Append -Encoding utf8
          if ($fv -ne $ver) { throw "version mismatch" }

      - name: Package
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $log = "D:\actions-runner\release.log"
          $ver = (Get-Content VERSION -Encoding UTF8).Trim()
          $zip = "dist\QingCaoEditor-v$ver-windows.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\QingCaoEditor/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Set-Content -Path "$zip.sha256.txt" -Value "$hash  $(Split-Path $zip -Leaf)" -Encoding ascii
          "ZIP=$zip`nSHA256=$hash" | Out-File $log -Append -Encoding utf8
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Release (curl + UTF-8 payload)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $log = "D:\actions-runner\release.log"
          $tag = $env:GITHUB_REF_NAME
          $ver = (Get-Content VERSION -Encoding UTF8).Trim()
          $zip = $env:ZIP
          $notes = "docs/release_notes_$tag.md"
          if (-not (Test-Path $notes)) { $notes = "CHANGELOG.md" }
          $body = [string](Get-Content $notes -Raw -Encoding UTF8)
          $payload = @{
            tag_name = $tag
            name = "QingCaoEditor $tag"
            body = $body
            draft = $false
            prerelease = $false
          } | ConvertTo-Json -Depth 3
          $payloadFile = Join-Path $env:TEMP "qc_release_payload.json"
          [System.IO.File]::WriteAllText($payloadFile, $payload,
            (New-Object System.Text.UTF8Encoding($false)))
          "PAYLOAD_LEN=$($payload.Length)" | Out-File $log -Append -Encoding utf8
          $auth = "Authorization: Bearer $env:GH_TOKEN"
          $base = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          function Curl([string[]]$ArgList) {
            $out = & curl.exe -sS -L --retry 5 --retry-delay 5 --retry-all-errors @ArgList
            if ($LASTEXITCODE -ne 0) { throw "curl failed rc=$LASTEXITCODE out=$out" }
            return $out
          }
          $existing = Curl @("-X", "GET", "-H", $auth, "-H", "Accept: application/vnd.github+json", "$base/releases/tags/$tag")
          $rel = $null
          try { $rel = $existing | ConvertFrom-Json } catch { $rel = $null }
          if ($rel -and $rel.id) {
            $resp = Curl @("-X", "PATCH", "-H", $auth, "-H", "Accept: application/vnd.github+json", "-H", "Content-Type: application/json", "--data-binary", "@$payloadFile", "$base/releases/$($rel.id)")
            "RELEASE_UPDATED $resp" | Out-File $log -Append -Encoding utf8
          } else {
            $resp = Curl @("-X", "POST", "-H", $auth, "-H", "Accept: application/vnd.github+json", "-H", "Content-Type: application/json", "--data-binary", "@$payloadFile", "$base/releases")
            "RELEASE_CREATED $resp" | Out-File $log -Append -Encoding utf8
          }
          "REL_RESP=$resp" | Out-File $log -Append -Encoding utf8
          $rel = Curl @("-X", "GET", "-H", $auth, "-H", "Accept: application/vnd.github+json", "$base/releases/tags/$tag") | ConvertFrom-Json
          "RELEASE_ID=$($rel.id)" | Out-File $log -Append -Encoding utf8
          if (-not $rel.id) { throw "release id missing" }
          $assetNames = @($rel.assets | ForEach-Object { $_.name })
          foreach ($f in @($zip, "$zip.sha256.txt")) {
            $name = Split-Path $f -Leaf
            if ($assetNames -contains $name) {
              "ASSET_EXISTS $name (skip)" | Out-File $log -Append -Encoding utf8
              continue
            }
            $resp = Curl @("-X", "POST", "-H", $auth, "-H", "Content-Type: application/octet-stream", "--data-binary", "@$f", "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($rel.id)/assets?name=$name")
            "UPLOAD_RESP=$resp" | Out-File $log -Append -Encoding utf8
            $up = $resp | ConvertFrom-Json
            if (-not $up.name -or [int64]$up.size -le 0) { throw "upload failed: $name" }
            "UPLOADED $($up.name) $([math]::Round($up.size/1MB,2))MB" | Out-File $log -Append -Encoding utf8
          }
          $final = Curl @("-X", "GET", "-H", $auth, "-H", "Accept: application/vnd.github+json", "$base/releases/tags/$tag") | ConvertFrom-Json
          $names = @($final.assets | ForEach-Object { $_.name })
          "ASSETS=" + ($names -join ",") | Out-File $log -Append -Encoding utf8
          foreach ($need in @("QingCaoEditor-v$ver-windows.zip", "QingCaoEditor-v$ver-windows.zip.sha256.txt")) {
            if ($names -notcontains $need) { throw "missing asset: $need" }
          }
          "ALL_DONE" | Out-File $log -Append -Encoding utf8
