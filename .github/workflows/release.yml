name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: debug checkout
        shell: powershell
        run: |
          $log = "D:\actions-runner\release.log"
          function L($m) { Add-Content -Path $log -Value $m -Encoding utf8 }
          L "START"
          try {
            L ("ws=" + $env:GITHUB_WORKSPACE)
            L ("sha=" + $env:GITHUB_SHA)
            $git = "d:\Program Files\Git\cmd\git.exe"
            L ("git_exists=" + (Test-Path $git))
            $dir = $env:GITHUB_WORKSPACE
            L ("dir_exists=" + (Test-Path $dir))
            L ("dotgit=" + (Test-Path "$dir\.git"))
            $out = & $git -C $dir remote -v 2>&1
            L ("remote=" + ($out -join ";"))
            & $git -C $dir remote set-url origin "git@github.com:$env:GITHUB_REPOSITORY.git" 2>&1 | Out-Null
            L ("seturl_rc=" + $LASTEXITCODE)
            $f = & $git -C $dir fetch --tags --force origin 2>&1
            L ("fetch_rc=" + $LASTEXITCODE)
            $f | Select-Object -Last 4 | ForEach-Object { L ("fetch: " + $_) }
            & $git -C $dir reset --hard $env:GITHUB_SHA 2>&1 | Out-Null
            L ("reset_rc=" + $LASTEXITCODE)
            L "DONE"
          } catch {
            L ("EXCEPTION: " + $_.Exception.Message)
            throw
          }