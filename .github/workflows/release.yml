name: Release

# 触发：推送 v* 标签（例如 v2.2.0）
#
# 修复记录（发布准备时发现的两个**发版阻断**问题）：
#   1. `actions/upload-artifact@v3` / `download-artifact@v3` 已于
#      2025-01-30 被 GitHub 官方**停用** —— 使用 v3 的 workflow 会在
#      启动时直接判定失败（"uses a deprecated version"），
#      因此打 tag 后**不会产出任何发布包**。现升级到 v4。
#   2. 缺少 `permissions: contents: write`：`softprops/action-gh-release`
#      需要写权限才能创建 Release；仓库默认 token 为只读时会 403 失败。
#      现显式声明。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 编码：GitHub 的 windows-latest 是英文 Windows（控制台/管道默认 cp1252），
# 而 build.py 会打印中文标题。Python 在管道下用 locale 编码写 stdout，
# 会抛 UnicodeEncodeError 导致构建直接失败（v2.2.0 首次发布即踩到）。
# build.py 内部已做 reconfigure 兜底，这里再设环境变量双保险。
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build-windows:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: python build.py

      - name: Verify version metadata
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Encoding UTF8).Trim()
          Write-Host "VERSION=$ver"
          $exe = "dist/QingCaoEditor/QingCaoEditor.exe"
          if (-not (Test-Path $exe)) { throw "构建产物缺失: $exe" }
          $fv = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "FileVersion=$fv"
          if ($fv -ne $ver) { throw "exe 版本 ($fv) 与 VERSION ($ver) 不一致" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingCaoEditor-windows
          path: dist/QingCaoEditor/
          retention-days: 7

  release:
    needs: [build-windows]
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: QingCaoEditor-windows
          path: QingCaoEditor-windows

      - name: Create ZIP
        run: |
          set -e
          cd QingCaoEditor-windows
          zip -r "../QingCaoEditor-${{ github.ref_name }}-windows.zip" .
          cd ..
          sha256sum "QingCaoEditor-${{ github.ref_name }}-windows.zip" \
            > "QingCaoEditor-${{ github.ref_name }}-windows.zip.sha256.txt"
          ls -lh QingCaoEditor-*.zip*

      # 发布说明：优先用仓库里的 docs/release_notes_<tag>.md
      # （例如 docs/release_notes_v2.2.0.md）；不存在时回退到
      # GitHub 自动生成的 Release Notes。
      #
      # 为什么用 step output 而不是直接写死 body_path：
      #   `body_path` 指向不存在的文件会让整个发布 job 失败。
      #   这里先判断文件是否存在，再把结果传给下一步。
      - name: Detect release notes
        id: notes
        run: |
          f="docs/release_notes_${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
            echo "使用发布说明文件: $f"
          else
            echo "未找到 $f，将使用自动生成的 Release Notes"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QingCaoEditor-${{ github.ref_name }}-windows.zip
            QingCaoEditor-${{ github.ref_name }}-windows.zip.sha256.txt
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
