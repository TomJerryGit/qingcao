name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-release:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: debug
        shell: powershell
        run: |
          $out = "D:\actions-runner\debug.txt"
          "=== env ===" | Out-File $out -Encoding utf8
          "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE" | Out-File $out -Append -Encoding utf8
          "GITHUB_SHA=$env:GITHUB_SHA" | Out-File $out -Append -Encoding utf8
          "GITHUB_REF_NAME=$env:GITHUB_REF_NAME" | Out-File $out -Append -Encoding utf8
          "GITHUB_REPOSITORY=$env:GITHUB_REPOSITORY" | Out-File $out -Append -Encoding utf8
          "=== git ===" | Out-File $out -Append -Encoding utf8
          (& "d:\Program Files\Git\cmd\git.exe" --version) 2>&1 | Out-File $out -Append -Encoding utf8
          "=== pwd ===" | Out-File $out -Append -Encoding utf8
          (Get-Location).Path | Out-File $out -Append -Encoding utf8
          "=== workspace ===" | Out-File $out -Append -Encoding utf8
          (Test-Path "$env:GITHUB_WORKSPACE") | Out-File $out -Append -Encoding utf8
          (Test-Path "$env:GITHUB_WORKSPACE\.git") | Out-File $out -Append -Encoding utf8
          Write-Host "debug written"