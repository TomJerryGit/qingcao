name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # 英文 Windows runner 默认 cp1252；测试输出/日志含中文会崩溃
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt coverage

      # 插件 conformance 契约（扩展点 + 清单 + API 面）
      # 只在 windows-latest 跑：需要真实 PyQt5 可用的 offscreen 环境，
      # ubuntu 上还缺 xcb/libGL 等依赖，容易误报。
      - name: Plugin conformance contracts
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest tests/test_plugin_conformance.py -q

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        continue-on-error: true
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
