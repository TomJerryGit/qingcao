name: Test

# Self-hosted CI (GitHub-hosted minutes exhausted).
# No external actions: SSH checkout + local Python.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  QT_QPA_PLATFORM: 'offscreen'

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout (SSH)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $env:HOME = "C:\Users\Administrator"
          $env:USERPROFILE = "C:\Users\Administrator"
          $env:GIT_TERMINAL_PROMPT = "0"
          $git = "d:\Program Files\Git\cmd\git.exe"
          $dir = $env:GITHUB_WORKSPACE
          $url = "git@github.com:$env:GITHUB_REPOSITORY.git"
          if (-not (Test-Path "$dir\.git")) { & $git clone $url $dir }
          & $git -C $dir remote set-url origin $url
          & $git -C $dir fetch --tags --force origin 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          & $git -C $dir reset --hard $env:GITHUB_SHA 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python -m pip install --upgrade pip 2>&1 | Select-Object -Last 2
          & python -m pip install -r requirements.txt pytest 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Version check
        shell: powershell
        run: python -m tools.check_version

      - name: Ruff
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { throw "ruff failed" }

      - name: Plugin conformance
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python -m pytest tests/test_plugin_conformance.py -q
          if ($LASTEXITCODE -ne 0) { throw "conformance failed" }

      - name: Plugin security audit
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python -m tools.audit_plugins --baseline tools/plugin_audit_baseline.json
          if ($LASTEXITCODE -ne 0) { throw "security audit failed" }

      - name: Full test suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $log = "D:\actions-runner\test.log"
          python -m pytest tests -q 2>&1 | Tee-Object -FilePath $log
          "PYTEST_RC=$LASTEXITCODE" | Out-File $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }