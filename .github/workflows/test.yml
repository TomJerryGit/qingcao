name: Test

# Self-hosted CI (GitHub-hosted minutes exhausted).
# No external actions: SSH checkout + local Python.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  QT_QPA_PLATFORM: 'offscreen'

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout (SSH)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $env:HOME = "C:\Users\Administrator"
          $env:USERPROFILE = "C:\Users\Administrator"
          $env:GIT_TERMINAL_PROMPT = "0"
          $git = "d:\Program Files\Git\cmd\git.exe"
          $dir = $env:GITHUB_WORKSPACE
          $url = "git@github.com:$env:GITHUB_REPOSITORY.git"
          if (-not (Test-Path "$dir\.git")) { & $git clone $url $dir }
          & $git -C $dir remote set-url origin $url
          & $git -C $dir fetch --tags --force origin 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          & $git -C $dir reset --hard $env:GITHUB_SHA 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python -m pip install --upgrade pip 2>&1 | Select-Object -Last 2
          & python -m pip install -r requirements.txt pytest 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Version check
        shell: powershell
        run: python -m tools.check_version

      - name: Ruff
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { throw "ruff failed" }

      - name: Plugin conformance
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python -m pytest tests/test_plugin_conformance.py -q
          if ($LASTEXITCODE -ne 0) { throw "conformance failed" }

      - name: Plugin security audit
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python -m tools.audit_plugins --baseline tools/plugin_audit_baseline.json
          if ($LASTEXITCODE -ne 0) { throw "security audit failed" }

      - name: Performance gate
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          python tools/bench_optimization.py --check --factor 10.0
          if ($LASTEXITCODE -ne 0) { throw "performance gate failed" }

      - name: Full test suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $log = "D:\actions-runner\test.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          & python tools/run_tests_sharded.py --shards 2 --retries 1 --parallel --localize 2>&1 | Out-File -FilePath $log -Encoding utf8
          $rc = $LASTEXITCODE
          "PYTEST_RC=$rc" | Out-File -FilePath $log -Append -Encoding utf8
          if ($rc -ne 0) { throw "tests failed: rc=$rc" }

  # Python 3.12 软矩阵：解释器/依赖不满足时自动跳过，不阻塞主门禁。
  test-py312:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout (SSH)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $env:HOME = "C:\Users\Administrator"
          $env:USERPROFILE = "C:\Users\Administrator"
          $git = "d:\Program Files\Git\cmd\git.exe"
          $dir = $env:GITHUB_WORKSPACE
          $url = "git@github.com:$env:GITHUB_REPOSITORY.git"
          if (-not (Test-Path "$dir\.git")) { & $git clone $url $dir }
          & $git -C $dir remote set-url origin $url
          & $git -C $dir fetch --tags --force origin 2>&1 | Out-Null
          & $git -C $dir reset --hard $env:GITHUB_SHA 2>&1 | Out-Null

      - name: Run tests on Python 3.12 (soft)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) {
            Write-Host "[soft-matrix] py launcher unavailable, skip"
            exit 0
          }
          $ver = & py -3.12 --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[soft-matrix] Python 3.12 not installed, skip"
            exit 0
          }
          Write-Host "[soft-matrix] detected: $ver"
          & py -3.12 -m pip install -r requirements.txt pytest 2>&1 | Select-Object -Last 3
          & py -3.12 -m pytest tests -q
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[soft-matrix] Python 3.12 tests failed (non-blocking)"
          }
          exit 0
